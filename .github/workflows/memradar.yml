name: Мем-радар

on:
  schedule:
    # каждые 10 минут: проверяет команды из чата; подборку шлёт раз в N часов (настройка every_hours)
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        default: digest
        options: [digest, test, auto, command]
      lang:
        description: "Язык подборки"
        type: choice
        default: all
        options: [all, ru, ua, en]
      count:
        description: "Сколько мемов (пусто = как в настройках)"
        required: false
        default: ""
      video:
        description: "Только видео"
        type: boolean
        default: false
      cmd:
        description: "Команда (для режима command, например /top 5 ua)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # нажатия кнопок (command) идут параллельно, чтобы не терялись; расписание и подборки — по одному
  group: memradar-${{ inputs.mode == 'command' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Запуск
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MODE: ${{ inputs.mode || 'auto' }}
          LANG_IN: ${{ inputs.lang || 'all' }}
          COUNT_IN: ${{ inputs.count || '' }}
          VIDEO_IN: ${{ inputs.video || false }}
          CMD_IN: ${{ inputs.cmd || '' }}
        run: python memradar.py --mode "$MODE" --lang "$LANG_IN" --count "$COUNT_IN" --video "$VIDEO_IN" --cmd "$CMD_IN"

      - name: Сохранить состояние
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config user.name "memradar-bot"
          git config user.email "memradar-bot@users.noreply.github.com"
          git add state.json sources.json
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -q -m "memradar: состояние $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            echo "Параллельный запуск успел раньше, сливаю состояние (попытка $i)"
            git fetch -q origin main
            python memradar.py --mode merge
            git reset -q origin/main
            git add state.json sources.json
            git diff --cached --quiet && exit 0
            git commit -q -m "memradar: состояние (слито) $(date -u +%F' '%H:%M)"
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
